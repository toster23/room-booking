<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Панель управления расписанием | ITeen Academy</title>
		<style>
			:root {
				--iteen-sky: #2bbad6;
				--iteen-dark: #0f4c81;
				--iteen-orange: #ff9800;
				--iteen-orange-hover: #f57c00;
				--bg-app: #f0f4f7;
				--card-bg: #ffffff;
				--text-main: #374151;
				--radius-lg: 16px;
				--radius-sm: 10px;
				--shadow: 0 10px 25px rgba(15, 76, 129, 0.08);
				--transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: "Segoe UI", Roboto, system-ui, sans-serif;
				background: linear-gradient(135deg, var(--iteen-sky) 0%, #199eb8 100%);
				background-attachment: fixed;
				color: var(--text-main);
				padding: 40px 20px 80px 20px;
				display: flex;
				justify-content: center;
			}

			.app-wrapper {
				width: 100%;
				max-width: 960px;
				background: var(--bg-app);
				border-radius: 24px;
				padding: 32px;
				box-shadow: 0 25px 50px rgba(15, 76, 129, 0.3);
			}

			.auth-overlay {
				position: fixed;
				top: 0; left: 0; right: 0; bottom: 0;
				background: rgba(15, 76, 129, 0.85);
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 1000;
				backdrop-filter: blur(4px);
				transition: var(--transition);
			}
			.auth-card {
				background: #fff;
				padding: 32px;
				border-radius: 20px;
				box-shadow: 0 20px 40px rgba(0,0,0,0.2);
				width: 100%;
				max-width: 400px;
				text-align: center;
			}
			.auth-card h2 { margin-bottom: 8px; color: var(--iteen-dark); font-weight: 700; }
			.auth-card p { font-size: 14px; color: #64748b; margin-bottom: 20px; }
			.auth-card select, .auth-card button { width: 100%; margin-bottom: 16px; }

			.header-block {
				display: flex;
				justify-content: space-between;
				align-items: center;
				border-bottom: 2px dashed #cfd8dc;
				padding-bottom: 24px;
				margin-bottom: 24px;
				flex-wrap: wrap;
				gap: 20px;
			}

			h1 { font-size: 28px; color: var(--iteen-dark); font-weight: 800; }
			h1 span { color: var(--iteen-orange); }
			.subtitle { font-size: 13px; color: #546e7a; font-weight: 600; margin-top: 4px; }
			.user-badge { font-size: 13px; background: var(--iteen-dark); color: #fff; padding: 6px 12px; border-radius: 20px; font-weight: 700; }
			h2 { font-size: 20px; color: var(--iteen-dark); margin-bottom: 18px; font-weight: 700; }

			.view-toggle { display: flex; background: #e2e8f0; padding: 4px; border-radius: var(--radius-sm); }
			.btn-toggle { height: 38px; padding: 0 18px; font-size: 14px; font-weight: 700; background: transparent; color: #64748b; border-radius: 8px; border: none; cursor: pointer; transition: var(--transition); }
			.btn-toggle.active { background: var(--card-bg); color: var(--iteen-dark); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); }

			.filter-card, .form-card, .matrix-section { background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
			.filter-row { display: flex; gap: 16px; flex-wrap: wrap; }
			.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
			.full-width { grid-column: 1 / -1; }
			.hidden { display: none !important; }

			label { display: flex; flex-direction: column; font-size: 13px; font-weight: 700; color: var(--iteen-dark); gap: 6px; }
			input[type="text"], input[type="date"], input[type="time"], select { height: 44px; padding: 0 14px; font-size: 14px; border: 2px solid #cbd5e1; border-radius: var(--radius-sm); background: #f8fafc; color: var(--text-main); outline: none; transition: var(--transition); }
			input:focus, select:focus { border-color: var(--iteen-sky); background: #fff; box-shadow: 0 0 0 4px rgba(43, 186, 214, 0.15); }
			input:disabled, select:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

			.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; min-height: 100px; }
			.item-card { background: #fff; border: 1px solid #e2e8f0; border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.01); transition: var(--transition); animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
			.item-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px rgba(15, 76, 129, 0.08); }
			
			.card-accent-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg); background: var(--iteen-sky); }
			.type-schedule .card-accent-line { background: var(--iteen-orange); }
			.card-title { font-size: 16px; font-weight: 700; color: var(--iteen-dark); margin-top: 4px; }
			.card-time { font-size: 13px; font-weight: 700; background: #e0f7fa; color: #006064; padding: 4px 10px; border-radius: 20px; width: fit-content; }
			.type-schedule .card-time { background: #fff3e0; color: #e65100; }
			.card-details { font-size: 13px; line-height: 1.5; color: #475569; }
			.card-details strong { color: var(--iteen-dark); }

			button { font-family: inherit; cursor: pointer; }
			.form-actions { display: flex; justify-content: flex-end; }
			
			.btn-action { height: 48px; padding: 0 32px; background: linear-gradient(135deg, var(--iteen-orange) 0%, #ffb74d 100% ); color: #fff; font-weight: 700; font-size: 15px; border: none; border-radius: var(--radius-sm); box-shadow: 0 4px 14px rgba(255, 152, 0, 0.3); transition: var(--transition); }
			.btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4); }
			
			.btn-delete { margin-top: auto; height: 32px; background: #fdf2f2; color: #ef4444; border: 1px solid #fde2e2; border-radius: 6px; font-size: 12px; font-weight: 600; transition: var(--transition); }
			.btn-delete:hover { background: #ef4444; color: #fff; }

			#message { min-height: 20px; font-size: 14px; font-weight: 700; color: #ef4444; text-align: center; margin-top: 12px; }
			.shake { animation: shakeAnim 0.3s ease-in-out; }
			.empty-state { grid-column: 1 / -1; text-align: center; padding: 44px 20px; color: #94a3b8; font-style: italic; font-size: 14px; }

			.status-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; padding: 10px 0; z-index: 100; }
			.status-container { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #64748b; max-width: 960px; margin: 0 auto; padding: 0 20px; }
			.status-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
			.connected .status-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }

			@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
			@keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

			@media (max-width: 768px) {
				.header-block { flex-direction: column; align-items: stretch; text-align: center; }
				.view-toggle { justify-content: center; }
				.form-grid { grid-template-columns: 1fr; }
			}
		</style>
	</head>
		<body>
		<!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ ПРИ ВХОДЕ -->
		<div id="auth-screen" class="auth-overlay">
			<div class="auth-card">
				<h2>Добро пожаловать</h2>
				<p>Пожалуйста, укажите вашу роль для работы</p>
				<label>Ваша роль
					<select id="auth-role">
						<option value="manager">Менеджер</option>
						<option value="teacher">Преподаватель</option>
					</select>
				</label>
				<label>Ваше имя
					<select id="auth-user-name"></select>
				</label>
				<button class="btn-action" onclick="login()">Войти в панель</button>
			</div>
		</div>

		<!-- ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ -->
		<div class="app-wrapper">
			<div class="header-block">
				<div class="logo-group">
					<h1>iTeen <span>Academy</span></h1>
					<p class="subtitle">Гомель | Расписание и Бронирование по схеме БД</p>
				</div>
				<div id="active-user-display" class="user-badge">Авторизация...</div>

				<div class="view-toggle">
					<button id="toggle-bookings" class="btn-toggle active">Разовые брони</button>
					<button id="toggle-schedule" class="btn-toggle">Недельное расписание</button>
				</div>
			</div>

			<div class="filter-card">
				<div class="filter-row">
					<label id="date-filter-label">Дата просмотра
						<input type="date" id="date" />
					</label>
					<label>Площадка (Sites)
						<select id="filter-site">
							<option value="">Все площадки</option>
						</select>
					</label>
				</div>
			</div>

			<div class="form-card">
				<h2 id="form-title">Забронировать кабинет</h2>
				<div class="form-grid">
					<label>Площадка
						<select id="form-site"></select>
					</label>
					<label id="form-date-label">Дата
						<input type="date" id="form-date" />
					</label>
					<label id="form-day-label" class="hidden">День недели
						<select id="form-day">
							<option value="1">Понедельник</option>
							<option value="2">Вторник</option>
							<option value="3">Среда</option>
							<option value="4">Четверг</option>
							<option value="5">Пятница</option>
							<option value="6">Суббота</option>
							<option value="0">Воскресенье</option>
						</select>
					</label>
					<label>Начало
						<input type="time" id="start" value="10:00" />
					</label>
					<label>Конец
						<input type="time" id="end" value="11:30" />
					</label>
					<label>Кто добавляет запись
						<select id="form-creator" disabled></select>
					</label>
					<label class="full-width">Описание / Имя группы
						<input type="text" id="name" placeholder="Программирование Python 1-й год" />
					</label>
				</div>
				<div class="form-actions">
					<button id="submit-btn" class="btn-action">Добавить запись</button>
				</div>
				<div id="message"></div>
			</div>

			<div class="matrix-section">
				<h2 id="matrix-title">Текущие брони</h2>
				<div id="cards-container" class="cards-grid"></div>
			</div>
		</div>

		<div class="status-footer" id="footer-status">
			<div class="status-container">
				<div class="status-dot"></div>
				<span id="status-text">Подключение к серверу...</span>
			</div>
		</div>
				<script>
			const API_BASE = "http://171.22.30.57:3000";
			let currentMode = "bookings"; 
			let currentUser = { role: "manager", name: "" };

			const managersList = ["Кристина", "Анастасия", "Виктория"];
			const teachersList = ["Анна П.", "Игорь С."];

			const authRole = document.getElementById("auth-role");
			const authUserName = document.getElementById("auth-user-name");
			const activeUserDisplay = document.getElementById("active-user-display");
			const formCreator = document.getElementById("form-creator");

			const dateFilter = document.getElementById("date");
			const filterSite = document.getElementById("filter-site");
			const formSite = document.getElementById("form-site");
			const formDate = document.getElementById("form-date");
			const formDay = document.getElementById("form-day");
			const startInput = document.getElementById("start");
			const endInput = document.getElementById("end");
			const nameInput = document.getElementById("name");
			const submitBtn = document.getElementById("submit-btn");
			const cardsContainer = document.getElementById("cards-container");
			const messageEl = document.getElementById("message");
			const footerStatus = document.getElementById("footer-status");
			const statusText = document.getElementById("status-text");

			// Установка сегодняшней даты
			const todayStr = new Date().toLocaleDateString("sv-SE");
			dateFilter.value = todayStr;
			formDate.value = todayStr;

			function updateAuthNames() {
				const list = authRole.value === "manager" ? managersList : teachersList;
				authUserName.innerHTML = "";
				list.forEach(name => {
					const opt = document.createElement("option");
					opt.value = name; opt.textContent = name;
					authUserName.appendChild(opt);
				});
			}
			authRole.addEventListener("change", updateAuthNames);
			updateAuthNames();

			function login() {
				currentUser.role = authRole.value;
				currentUser.name = authUserName.value;

				activeUserDisplay.textContent = `${currentUser.role === 'manager' ? '💼' : '🎓'} ${currentUser.name}`;
				document.getElementById("auth-screen").style.display = "none";
				formCreator.innerHTML = `<option>${currentUser.name}</option>`;

				if (currentUser.role === "teacher") {
					document.getElementById("toggle-schedule").click();
				} else {
					document.getElementById("toggle-bookings").click();
				}
			}

			function showMsg(text, isError = true) {
				messageEl.textContent = text;
				messageEl.style.color = isError ? "#ef4444" : "#10b981";
				if (isError) {
					messageEl.classList.remove("shake");
					void messageEl.offsetWidth;
					messageEl.classList.add("shake");
				}
			}

			document.getElementById("toggle-bookings").addEventListener("click", (e) => switchMode("bookings", e.target));
			document.getElementById("toggle-schedule").addEventListener("click", (e) => switchMode("schedule", e.target));

			function switchMode(mode, targetBtn) {
				currentMode = mode;
				document.querySelectorAll(".btn-toggle").forEach(b => b.classList.remove("active"));
				targetBtn.classList.add("active");

				if (mode === "bookings") {
					document.getElementById("date-filter-label").classList.remove("hidden");
					document.getElementById("form-date-label").classList.remove("hidden");
					document.getElementById("form-day-label").classList.add("hidden");
					document.getElementById("form-title").textContent = "Забронировать кабинет (Разово)";
					document.getElementById("matrix-title").textContent = "Текущие разовые брони";
				} else {
					document.getElementById("date-filter-label").classList.add("hidden");
					document.getElementById("form-date-label").classList.add("hidden");
					document.getElementById("form-day-label").classList.remove("hidden");
					document.getElementById("form-title").textContent = "Добавить регулярное расписание";
					document.getElementById("matrix-title").textContent = "Недельная сетка занятий";
				}
				loadData();
			}

			let siteNamesMap = {};

			async function loadSites() {
				try {
					const res = await fetch(`${API_BASE}/api/sites`);
					const sites = await res.json();
					filterSite.innerHTML = '<option value="">Все площадки</option>';
					formSite.innerHTML = '';
					siteNamesMap = {};
					
					sites.forEach(s => {
						siteNamesMap[s.id] = s.name;
						const opt1 = document.createElement("option"); opt1.value = s.id; opt1.textContent = s.name; filterSite.appendChild(opt1);
						const opt2 = document.createElement("option"); opt2.value = s.id; opt2.textContent = s.name; formSite.appendChild(opt2);
					});
					footerStatus.classList.add("connected");
					statusText.textContent = "Подключено к бэкенду iTeen";
				} catch (err) {
					footerStatus.classList.remove("connected");
					statusText.textContent = "Сервер недоступен";
				}
			}

			async function loadData() {
				try {
					let url = `${API_BASE}/api/${currentMode}`;
					if (currentMode === "bookings") url += `?date=${dateFilter.value}`;
					if (filterSite.value) url += (url.includes("?") ? "&" : "?") + `siteId=${filterSite.value}`;

					const res = await fetch(url);
					const items = await res.json();
					renderCards(items);
					footerStatus.classList.add("connected");
					statusText.textContent = "Подключено к бэкенду iTeen";
				} catch (err) {
					footerStatus.classList.remove("connected");
					statusText.textContent = "Сбой синхронизации данных";
				}
			}

			const daysMap = { "1": "Понедельник", "2": "Вторник", "3": "Среда", "4": "Четверг", "5": "Пятница", "6": "Суббота", "0": "Воскресенье" };

			function renderCards(items) {
				cardsContainer.innerHTML = "";
				if (items.length === 0) {
					cardsContainer.innerHTML = `<div class="empty-state">Записей не обнаружено. Измените фильтры или добавьте новую!</div>`;
					return;
				}

				items.forEach(item => {
					const card = document.createElement("div");
					card.className = `item-card type-${currentMode}`;
					let specificDetail = currentMode === "bookings" ? `<strong>Дата:</strong> ${item.date}` : `<strong>День:</strong> ${daysMap[item.day] || item.day}`;
					let displaySiteName = siteNamesMap[item.siteId] || `Площадка №${item.siteId}`;

					card.innerHTML = `
						<div class="card-accent-line"></div>
						<div class="card-time">${item.start} – ${item.end}</div>
						<div class="card-title">${item.name}</div>
						<div class="card-details">
							<strong>Филиал:</strong> ${displaySiteName}<br>
							${specificDetail}
						</div>
						<button class="btn-delete" onclick="deleteItem(${item.id})">Удалить запись</button>
					`;
					cardsContainer.appendChild(card);
				});
			}

			submitBtn.addEventListener("click", async () => {
				showMsg("");
				const body = {
					siteId: Number(formSite.value),
					start: startInput.value,
					end: endInput.value,
					name: nameInput.value.trim() || currentUser.name
				};

				if (currentMode === "bookings") {
					body.date = formDate.value;
				} else {
					body.day = Number(formDay.value);
				}

				try {
					const res = await fetch(`${API_BASE}/api/${currentMode}`, {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(body)
					});
					const data = await res.json();
					if (res.ok) {
						showMsg("Запись успешно сохранена в систему!", false);
						nameInput.value = "";
						loadData();
					} else {
						showMsg(data.error || "Ошибка сохранения");
					}
				} catch (err) {
					showMsg("Не удалось связаться с сервером");
				}
			});

			window.deleteItem = async function(id) {
				if (!confirm("Вы действительно хотите удалить эту запись?")) return;
				try {
					const res = await fetch(`${API_BASE}/api/${currentMode}/${id}`, { method: "DELETE" });
					if (res.ok) loadData();
				} catch (err) { alert("Ошибка отправки сетевого запроса"); }
			};

			dateFilter.addEventListener("change", loadData);
			filterSite.addEventListener("change", loadData);

			async function init() {
				await loadSites();
				await loadData();
			}
			init();
			setInterval(loadData, 3000);
		</script>
	</body>
</html>
